<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>아덴 월드</title>
<style>
html,body{height:100%;margin:0}body{display:flex;align-items:center;justify-content:center;background:#0d0a0e;color:#e8e2cc;font-family:"Noto Sans KR","Malgun Gothic",sans-serif}
.box{max-width:440px;margin:16px;padding:22px 24px;border:1px solid #6e5a34;border-radius:8px;background:#1a1410;text-align:center;line-height:1.7}
b{display:block;font-size:18px;color:#f2d98a;margin-bottom:8px}small{color:#a89c84}
button{margin-top:16px;padding:10px 22px;font:700 15px inherit;font-family:inherit;color:#1a1410;background:#e8c878;border:0;border-radius:6px;cursor:pointer}
</style></head><body>
<!-- 11/3: 중복 접속으로 끊긴 창이 오는 곳 — 게임 화면을 닫아 메모리·CPU를 비움 (이 페이지는 거의 메모리를 안 씀) -->
<div class="box" role="alertdialog"><b id="t">다른 곳에서 같은 계정으로 접속했어요</b>
<div id="d">같은 계정은 한 곳에서만 플레이할 수 있어서 이 창의 게임을 멈추고 메모리를 비웠어요.<br>진행 상황은 새로 접속한 쪽에서 이어서 저장돼요.</div>
<small>이 창에서 다시 하려면 아래 버튼을 누르세요. (그러면 다른 곳의 접속이 끊겨요)</small><br>
<button type="button" id="re">다시 접속하기</button></div>
<script>
if (/[?&]r=admin\b/.test(location.search)) { document.getElementById('t').textContent = '운영자에 의해 접속이 종료되었어요'; document.getElementById('d').textContent = '진행 상황은 저장했어요.'; }
document.getElementById('re').onclick = function () { location.replace('index.html'); };
</script></body></html>
